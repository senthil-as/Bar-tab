<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f4f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121016" media="(prefers-color-scheme: dark)">
  <title>Bar Tab</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script>
    // apply saved theme before first paint so there's no flash
    try {
      var t = (JSON.parse(localStorage.getItem('bartab.v1') || '{}').settings || {}).theme;
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <main id="app"></main>

  <nav class="tabbar" aria-label="Sections">
    <button data-go="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10l-1.2 9.5a3.8 3.8 0 0 1-7.6 0L7 3Z"/><path d="M12 16v5M8.5 21h7"/></svg>
      <span>Tonight</span>
    </button>
    <button data-go="recap">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span>Recap</span>
    </button>
    <button data-go="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
      <span>Settings</span>
    </button>
  </nav>

  <div id="overlay" hidden></div>
  <div id="toast" role="status" hidden></div>

  <script src="app.js"></script>
</body>
</html>
